<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>luminous admin</title>
</head>

<body>

  <div id="root">
    <div class="root-wrapper">
      <div class="loader"></div>
    </div>
  </div>



  <style>
    html,
    body,
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }

    * {
      margin: 0;
      padding: 0;
    }

    .root-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loader {
      width: fit-content;
      font-weight: bold;
      font-family: monospace;
      font-size: 30px;
      color: #0000;
      background: linear-gradient(90deg, #844dc9 25%, #8A9B0F 0 50%, #C02942 0 75%, #00A0B0 0) 0 0/400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: l10 5s infinite cubic-bezier(0.3, 1, 0, 1);
    }

    .loader:before {
      content: "Loading..."
    }

    @keyframes l10 {
      25% {
        background-position: calc(1*100%/3) 0
      }

      50% {
        background-position: calc(2*100%/3) 0
      }

      75% {
        background-position: calc(3*100%/3) 0
      }

      100% {
        background-position: calc(4*100%/3) 0
      }
    }



    .loader-text {
      color: white;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
